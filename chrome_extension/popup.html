<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>그룹스 자동 추가</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; padding: 15px; width: 350px; }
    h3 { margin-top: 0; margin-bottom: 10px; color: #333; }
    p.desc { font-size: 11px; color: #666; margin-bottom: 10px; line-height: 1.4; background:#f9f9f9; padding:8px; border-radius:4px; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 5px; }
    th, td { border: 1px solid #ddd; padding: 0; text-align: center; }
    th { background-color: #f1f3f4; font-size: 12px; padding: 6px 0; color: #555; }
    td input[type="text"] { width: 95%; border: none; outline: none; font-size: 12px; padding: 6px 2px; text-align: center; background: transparent; }
    td input[type="text"]:focus { background-color: #e8f0fe; }
    
    .btn-row { text-align: right; margin-bottom: 15px; margin-top: 5px; }
    .small-btn { width: auto; padding: 5px 10px; background-color: #fff; color: #555; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; cursor: pointer; }
    .small-btn:hover { background-color: #eee; }
    
    #startBtn { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }
    #startBtn:hover { background-color: #1557b0; }
    #startBtn:disabled { background-color: #ccc; cursor: not-allowed; }
    
    #status { margin-top: 15px; font-size: 12px; color: #333; white-space: pre-wrap; font-weight:bold; text-align: center; }
  </style>
</head>
<body>
  <h3>에이블런 그룹스 추가</h3>
  <p class="desc">
    💡 <b>엑셀 복사/붙여넣기 지원!</b><br>
    엑셀에서 두 열(이메일, GPT아이디)을 드래그해서 복사한 뒤, 아래 표의 아무 칸에나 <b>Ctrl+V(붙여넣기)</b> 하시면 표가 자동으로 채워집니다.
  </p>
  
  <table id="excelGrid">
    <thead>
      <tr>
        <th width="60%">이메일 (A열)</th>
        <th width="40%">그룹ID (B열)</th>
      </tr>
    </thead>
    <tbody id="gridBody">
      <!-- 기본 3줄 제공 -->
      <tr><td><input type="text" placeholder="test@email.com"></td><td><input type="text" placeholder="gpt10"></td></tr>
      <tr><td><input type="text"></td><td><input type="text"></td></tr>
      <tr><td><input type="text"></td><td><input type="text"></td></tr>
    </tbody>
  </table>
  
  <div class="btn-row">
    <button class="small-btn" id="addRowBtn">+ 한 줄 추가</button>
    <button class="small-btn" id="clearBtn">초기화</button>
  </div>

  <button id="startBtn">▶ 순차적 자동 추가 시작</button>
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
