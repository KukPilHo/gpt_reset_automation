<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>그룹스 자동 추가</title>
  <style>
    body { 
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
      padding: 0; 
      margin: 0; 
      width: 420px; 
      background-color: #f4f6f9; 
      color: #333; 
    }
    .header { 
      background-color: #1a73e8; 
      color: white; 
      padding: 16px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 16px; 
      letter-spacing: -0.5px;
    }
    .container { 
      padding: 16px; 
    }
    
    .step-box { 
      background: white; 
      border-radius: 10px; 
      padding: 16px; 
      margin-bottom: 16px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); 
    }
    .step-title { 
      font-size: 14px; 
      font-weight: bold; 
      color: #1a73e8; 
      margin-bottom: 10px; 
      display: flex; 
      align-items: center; 
    }
    .step-title span { 
      display: inline-flex; 
      justify-content: center;
      align-items: center;
      background: #e8f0fe; 
      color: #1a73e8; 
      width: 22px; 
      height: 22px; 
      border-radius: 50%; 
      margin-right: 8px; 
      font-size: 13px; 
    }
    .step-desc { 
      font-size: 13px; 
      color: #555; 
      line-height: 1.5; 
      margin-bottom: 12px; 
      word-break: keep-all;
    }
    .highlight { 
      background-color: #fef0cd; 
      padding: 2px 5px; 
      border-radius: 4px; 
      font-weight: 600; 
      color: #b06000;
    }
    .tip-box {
      background-color: #f8fbff;
      border-left: 3px solid #1a73e8;
      padding: 10px 12px;
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      border-radius: 0 6px 6px 0;
    }

    /* Textarea for pasting */
    textarea.paste-area { 
      width: 100%; 
      height: 80px; 
      padding: 12px; 
      border: 2px dashed #90bbf4; 
      border-radius: 8px; 
      resize: none; 
      font-size: 13px; 
      box-sizing: border-box; 
      background-color: #fff; 
      outline: none; 
      transition: all 0.2s ease; 
      color: #333;
    }
    textarea.paste-area::placeholder {
      color: #999;
    }
    textarea.paste-area:focus { 
      border-color: #1a73e8; 
      background-color: #f8fbff;
    }

    /* Preview Table */
    .table-wrapper { 
      max-height: 160px; 
      overflow-y: auto; 
      border: 1px solid #e0e0e0; 
      border-radius: 6px; 
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
    }
    th, td { 
      border-bottom: 1px solid #eee; 
      padding: 8px 10px; 
      text-align: center; 
      font-size: 12px; 
    }
    th { 
      background-color: #f8f9fa; 
      position: sticky; 
      top: 0; 
      color: #444; 
      font-weight: 600; 
      z-index: 1;
    }
    td input { 
      width: 95%; 
      border: 1px solid transparent; 
      text-align: center; 
      font-size: 12px; 
      padding: 6px 4px; 
      border-radius: 4px; 
      background: transparent;
      transition: border 0.2s;
    }
    td input:focus { 
      border: 1px solid #1a73e8; 
      outline: none; 
      background: #fff; 
    }
    td input:hover {
      background: #f8f9fa;
    }
    
    .empty-state { 
      text-align: center; 
      padding: 25px 10px; 
      color: #999; 
      font-size: 13px; 
    }

    .actions { 
      display: flex; 
      justify-content: space-between; 
      margin-top: 5px; 
    }
    .btn { 
      border: none; 
      padding: 12px 16px; 
      border-radius: 8px; 
      font-size: 14px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-clear { 
      background-color: #e8eaed; 
      color: #5f6368; 
    }
    .btn-clear:hover { 
      background-color: #dadce0; 
    }
    .btn-start { 
      background-color: #1a73e8; 
      color: white; 
      flex-grow: 1; 
      margin-left: 12px; 
      box-shadow: 0 2px 4px rgba(26,115,232,0.25); 
    }
    .btn-start:hover { 
      background-color: #1557b0; 
      box-shadow: 0 4px 8px rgba(26,115,232,0.3);
    }
    .btn-start:disabled { 
      background-color: #bdc1c6; 
      box-shadow: none; 
      cursor: not-allowed; 
    }

    #status { 
      margin-top: 15px; 
      font-size: 13px; 
      font-weight: 600; 
      text-align: center; 
      color: #1a73e8; 
      white-space: pre-wrap;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    에이블런 그룹스 일괄 등록기
  </div>
  <div class="container">
    
    <div class="step-box">
      <div class="step-title"><span>1</span>데이터 준비 및 붙여넣기</div>
      <div class="step-desc">
        엑셀(또는 스프레드시트)에서 <b>[등록할 이메일]</b>과 <b>[할당할 GPT 계정]</b> 두 열을 드래그하여 복사한 후, 아래 빈 칸에 붙여넣기(<kbd>Ctrl</kbd> + <kbd>V</kbd>) 해주세요.
      </div>
      <textarea id="pasteArea" class="paste-area" placeholder="여기를 클릭하고 복사한 데이터를 붙여넣으세요 (Ctrl+V)"></textarea>
      
      <div class="tip-box">
        💡 <b>입력 꿀팁</b><br>
        GPT 계정은 <span class="highlight">gpt10</span> 처럼 숫자만 쓰거나, <span class="highlight">gpt10@ablearn.kr</span> 처럼 전체 이메일을 써도 모두 자동 인식됩니다!
      </div>
    </div>

    <div class="step-box">
      <div class="step-title"><span>2</span>데이터 확인</div>
      <div class="table-wrapper">
        <table id="previewTable">
          <thead>
            <tr>
              <th width="60%">등록할 이메일 (A열)</th>
              <th width="40%">할당할 GPT 계정 (B열)</th>
            </tr>
          </thead>
          <tbody id="gridBody">
            <tr><td colspan="2" class="empty-state">위 칸에 데이터를 붙여넣으면 표가 생성됩니다.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-clear" id="clearBtn">초기화</button>
      <button class="btn btn-start" id="startBtn">▶ 순차적 자동 추가 시작</button>
    </div>
    
    <div id="status"></div>

  </div>
  
  <script src="popup.js"></script>
</body>
</html>
