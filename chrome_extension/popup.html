<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>그룹스 자동 추가</title>
  <style>
    body { 
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
      padding: 0; 
      margin: 0; 
      width: 460px; 
      background-color: #f4f6f9; 
      color: #333; 
    }
    .header { 
      background: linear-gradient(135deg, #1a73e8, #4285f4);
      color: white; 
      padding: 14px 16px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 15px; 
      letter-spacing: -0.5px;
    }
    .container { 
      padding: 14px; 
    }
    
    /* Step card */
    .step-box { 
      background: white; 
      border-radius: 10px; 
      padding: 14px 16px; 
      margin-bottom: 12px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); 
    }
    .step-title { 
      font-size: 13px; 
      font-weight: bold; 
      color: #1a73e8; 
      margin-bottom: 10px; 
      display: flex; 
      align-items: center; 
    }
    .step-title .num { 
      display: inline-flex; 
      justify-content: center;
      align-items: center;
      background: #e8f0fe; 
      color: #1a73e8; 
      width: 20px; 
      height: 20px; 
      border-radius: 50%; 
      margin-right: 8px; 
      font-size: 12px;
      flex-shrink: 0;
    }
    .step-desc { 
      font-size: 12px; 
      color: #666; 
      line-height: 1.5; 
      margin-bottom: 12px; 
      word-break: keep-all;
    }
    .tip-box {
      background-color: #f0f7ff;
      border-left: 3px solid #1a73e8;
      padding: 8px 10px;
      font-size: 11px;
      color: #555;
      margin-top: 10px;
      border-radius: 0 6px 6px 0;
      line-height: 1.5;
    }
    .highlight { 
      background-color: #fef0cd; 
      padding: 1px 4px; 
      border-radius: 3px; 
      font-weight: 600; 
      color: #b06000;
      font-size: 11px;
    }

    /* ===== Excel-like Grid ===== */
    .grid-wrapper { 
      border: 2px solid #dadce0; 
      border-radius: 6px; 
      overflow: hidden;
    }
    .grid-scroll {
      max-height: 220px;
      overflow-y: auto;
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      table-layout: fixed;
    }
    /* Row number column */
    col.col-num { width: 32px; }
    col.col-email { width: auto; }
    col.col-gpt { width: 42%; }

    thead th { 
      background-color: #f1f3f4; 
      border-bottom: 2px solid #dadce0;
      padding: 6px 4px; 
      text-align: center; 
      font-size: 11px; 
      font-weight: 600;
      color: #5f6368;
      position: sticky; 
      top: 0; 
      z-index: 2;
      user-select: none;
    }
    thead th.corner {
      background-color: #e8eaed;
      border-right: 1px solid #dadce0;
    }

    tbody td { 
      border-bottom: 1px solid #e8eaed; 
      border-right: 1px solid #e8eaed;
      padding: 0; 
      text-align: center; 
      font-size: 12px;
      height: 28px;
    }
    tbody td:last-child { border-right: none; }

    /* Row number cell */
    td.row-num {
      background-color: #f1f3f4;
      color: #80868b;
      font-size: 11px;
      font-weight: 500;
      border-right: 1px solid #dadce0;
      user-select: none;
      text-align: center;
      padding: 0 2px;
    }

    td input { 
      width: 100%; 
      border: none;
      outline: none;
      text-align: center; 
      font-size: 12px; 
      padding: 6px 4px; 
      background: transparent;
      box-sizing: border-box;
      color: #333;
    }
    td input::placeholder {
      color: #bbb;
      font-style: italic;
    }
    td input:focus { 
      background: #e8f0fe; 
    }
    /* Example row styling */
    tr.example-row td input {
      color: #999;
    }
    tr.example-row td input:focus {
      color: #333;
    }

    /* ===== Buttons ===== */
    .actions { 
      display: flex; 
      justify-content: space-between; 
      margin-top: 8px; 
    }
    .btn { 
      border: none; 
      padding: 11px 16px; 
      border-radius: 8px; 
      font-size: 13px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-clear { 
      background-color: #e8eaed; 
      color: #5f6368; 
    }
    .btn-clear:hover { background-color: #dadce0; }
    .btn-start { 
      background-color: #1a73e8; 
      color: white; 
      flex-grow: 1; 
      margin-left: 10px; 
      box-shadow: 0 2px 4px rgba(26,115,232,0.25); 
    }
    .btn-start:hover { 
      background-color: #1557b0; 
      box-shadow: 0 4px 8px rgba(26,115,232,0.3);
    }
    .btn-start:disabled { 
      background-color: #bdc1c6; 
      box-shadow: none; 
      cursor: not-allowed; 
    }
    #status { 
      margin-top: 12px; 
      font-size: 12px; 
      font-weight: 600; 
      text-align: center; 
      color: #1a73e8; 
      white-space: pre-wrap;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">에이블런 그룹스 일괄 등록기</div>
  <div class="container">
    
    <div class="step-box">
      <div class="step-title"><span class="num">1</span>데이터 입력</div>
      <div class="step-desc">
        아래 표에 <b>직접 입력</b>하거나, 엑셀/스프레드시트에서 두 열을 복사한 뒤 표의 아무 셀에 <b>Ctrl+V</b>로 붙여넣으세요.
      </div>

      <div class="grid-wrapper">
        <div class="grid-scroll">
          <table id="excelGrid">
            <colgroup>
              <col class="col-num">
              <col class="col-email">
              <col class="col-gpt">
            </colgroup>
            <thead>
              <tr>
                <th class="corner"></th>
                <th>등록할 이메일 (A)</th>
                <th>할당할 GPT 계정 (B)</th>
              </tr>
            </thead>
            <tbody id="gridBody">
              <!-- JS가 초기 행 생성 -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="tip-box">
        💡 GPT 계정은 <span class="highlight">gpt10</span> 또는 <span class="highlight">gpt10@ablearn.kr</span> 형태 모두 OK!&nbsp;&nbsp;|&nbsp;&nbsp;빈 행은 자동으로 무시됩니다.
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-clear" id="clearBtn">초기화</button>
      <button class="btn btn-start" id="startBtn">▶ 순차적 자동 추가 시작</button>
    </div>
    <div id="status"></div>
    <div id="logArea" style="margin-top:8px; font-size:11px; text-align:left; color:#555; max-height:100px; overflow-y:auto;"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
